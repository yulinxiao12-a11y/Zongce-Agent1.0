{% extends "base.html" %}
{% block title %}审核队列 - 综测星轨{% endblock %}
{% block content %}
<div class="page">
    <div class="page-header" style="padding:24px 0 8px;margin-bottom:20px;">
        <h1 style="font-size:28px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px;"><i class="fas fa-clipboard-check" style="color:var(--primary);"></i> 星轨审核中心</h1>
        <p style="color:var(--text-muted);margin-top:4px;font-size:14px;">审核学生提交的证明材料 · 管理综测系统运行状态</p>
    </div>

    <!-- 统计卡片 -->
    <div class="admin-stats" id="adminStats">
        <div class="admin-stat-card">
            <div class="admin-stat-icon blue"><i class="fas fa-user-graduate"></i></div>
            <div><div class="admin-stat-value" id="statStudents">--</div><div class="admin-stat-label">注册学生数</div></div>
        </div>
        <div class="admin-stat-card">
            <div class="admin-stat-icon amber"><i class="fas fa-clock"></i></div>
            <div><div class="admin-stat-value" id="statPending">--</div><div class="admin-stat-label">待审核提交</div></div>
        </div>
        <div class="admin-stat-card">
            <div class="admin-stat-icon green"><i class="fas fa-check-circle"></i></div>
            <div><div class="admin-stat-value" id="statApproved">--</div><div class="admin-stat-label">今日通过</div></div>
        </div>
        <div class="admin-stat-card">
            <div class="admin-stat-icon purple"><i class="fas fa-file-alt"></i></div>
            <div><div class="admin-stat-value" id="statSubmissions">--</div><div class="admin-stat-label">总提交数</div></div>
        </div>
    </div>

    <div class="flex-between mb-16">
        <div></div>
        <div class="filter-bar">
            <button class="btn btn-success btn-sm" onclick="bulkApproveHighConfidence()"><i class="fas fa-check-double"></i> 高置信批量通过</button>
            <select id="filterQueue" onchange="currentPage=1;loadSubmissions()">
                <option value="">全部队列</option>
                <option value="pending" selected>待人工审核</option>
                <option value="high_confidence">绿灯高置信</option>
                <option value="needs_more">需补材料</option>
                <option value="risk">红灯高风险</option>
                <option value="approved">已通过</option>
                <option value="rejected">已驳回</option>
            </select>
        </div>
    </div>

    <div class="card">
        <div class="card-body" style="padding:0;">
            <div class="table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>学生</th><th>匹配项目</th><th>级别</th><th>得分</th>
                            <th>材料</th><th>AI 置信度</th><th>风控</th><th>提交时间</th><th style="min-width:230px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="submissionsTableBody">
                        <tr><td colspan="10"><div class="spinner"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="flex-between mt-16" id="paginationBar" style="display:none;">
        <span class="text-muted" style="font-size:13px;" id="pageInfo"></span>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-outline btn-sm" id="btnPrev" onclick="changePage(-1)" disabled>上一页</button>
            <button class="btn btn-outline btn-sm" id="btnNext" onclick="changePage(1)" disabled>下一页</button>
        </div>
    </div>
</div>

<!-- Audit Drawer -->
<div class="audit-drawer-overlay" id="auditDrawerOverlay" style="display:none;" onclick="closeAuditDrawer(event)">
    <aside class="audit-drawer" onclick="event.stopPropagation()">
        <div class="audit-drawer-head">
            <div>
                <span id="drawerAuditId">#--</span>
                <h3 id="drawerTitle">审核详情</h3>
            </div>
            <button type="button" onclick="closeAuditDrawer()" aria-label="关闭"><i class="fas fa-times"></i></button>
        </div>
        <div class="audit-drawer-body" id="auditDrawerBody"></div>
        <div class="audit-drawer-actions" id="auditDrawerActions"></div>
    </aside>
</div>

<!-- Review Modal -->
<div class="modal-overlay" id="reviewModal" style="display:none;">
    <div class="modal-box">
        <h3 id="reviewModalTitle">审核操作</h3>
        <div id="reviewModalInfo" style="font-size:13px; color:var(--text-muted); margin-bottom:12px;"></div>
        <div class="form-group">
            <label>审核备注</label>
            <textarea id="reviewRemarks" placeholder="输入审核意见..."></textarea>
        </div>
        <div class="form-group" id="reassignGroup" style="display:none;">
            <label>重新分配到项目ID</label>
            <input type="text" id="reassignItemId" placeholder="输入综测项目ID">
        </div>
        <div class="modal-actions" id="reviewActions"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const STATUS_LABELS = {
    pending: '<span class="status-badge status-pending">待审核</span>',
    needs_more: '<span class="status-badge status-needs_more">需补材料</span>',
    auto_approved: '<span class="status-badge status-auto_approved">历史AI通过</span>',
    approved: '<span class="status-badge status-approved">已通过</span>',
    rejected: '<span class="status-badge status-rejected">已驳回</span>',
};
const LVL_BADGES = {'国家级':'badge-national','省级':'badge-provincial','校级':'badge-school','院级':'badge-college','班级':'badge-college'};

let currentPage = 1;
let totalPages = 1;
let currentSub = null;

async function loadSubmissions() {
    const queue = document.getElementById('filterQueue').value;
    const resp = await fetch(`/api/admin/submissions?queue=${queue}&page=${currentPage}&per_page=15`);
    const data = await resp.json();

    totalPages = Math.ceil(data.total / data.per_page) || 1;
    document.getElementById('pageInfo').textContent = `共 ${data.total} 条，第 ${data.page} / ${totalPages} 页`;
    document.getElementById('btnPrev').disabled = currentPage <= 1;
    document.getElementById('btnNext').disabled = currentPage >= totalPages;
    document.getElementById('paginationBar').style.display = data.total > 0 ? 'flex' : 'none';

    if (data.submissions.length === 0) {
        document.getElementById('submissionsTableBody').innerHTML =
            '<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--text-muted);">暂无提交记录</td></tr>';
        return;
    }

    document.getElementById('submissionsTableBody').innerHTML = data.submissions.map(s => {
        const level = confidenceLevel(s.ai_confidence, s);
        const riskTags = ((s.risk_assessment && s.risk_assessment.risk_tags) || []).slice(0, 3);
        return `
        <tr class="audit-row audit-row-${level}">
            <td style="white-space:nowrap;">#${s.id}</td>
            <td style="white-space:nowrap;"><strong>${escHtml(s.student_name)}</strong><br><span style="font-size:11px;color:var(--text-muted);">${escHtml(s.student_id)}</span></td>
            <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;"><strong>${escHtml(s.title)}</strong></td>
            <td style="white-space:nowrap;"><span class="badge ${LVL_BADGES[s.level]||'badge-college'}">${s.level||'-'}</span></td>
            <td style="white-space:nowrap;color:var(--primary);font-weight:700;">+${s.score||0}</td>
            <td style="white-space:nowrap;">
                ${s.files && s.files.length > 0 ? `<span style="font-size:12px;cursor:pointer;color:var(--primary);" onclick="showFiles(${s.id})"><i class="fas fa-paperclip"></i> ${s.files.length}个</span>` : '-'}
            </td>
            <td style="white-space:nowrap;">
                <span class="confidence-tag confidence-${level}">${Number(s.ai_confidence).toFixed(1)}% · ${confidenceLabel(level)}</span>
            </td>
            <td style="white-space:nowrap;">
                <div class="risk-tag-list">
                    ${riskTags.length ? riskTags.map(tag => `<span>${escHtml(tag)}</span>`).join('') : (s.missing_fields && s.missing_fields.length ? '<span>SUPPLEMENT_REQUIRED</span>' : '<span class="muted">--</span>')}
                </div>
            </td>
            <td style="font-size:11px;white-space:nowrap;">${s.created_at}</td>
            <td style="white-space:nowrap;min-width:230px;">
                <div class="action-btns">
                    <button class="btn btn-outline btn-sm" onclick="openAuditDrawer(${s.id})"><i class="fas fa-list-check"></i> 证据链</button>
                    ${['pending', 'needs_more'].includes(s.status) ? `
                    <button class="btn btn-success btn-sm" onclick="openReview(${s.id}, 'approve')"><i class="fas fa-check"></i> 通过</button>
                    <button class="btn btn-outline btn-sm" onclick="openReview(${s.id}, 'needs_more')" style="color:var(--accent-amber);"><i class="fas fa-triangle-exclamation"></i> 补材料</button>
                    <button class="btn btn-outline btn-sm" onclick="openReview(${s.id}, 'reject')" style="color:var(--danger);"><i class="fas fa-times"></i> 驳回</button>
                    <button class="btn btn-outline btn-sm" onclick="openReview(${s.id}, 'reassign')"><i class="fas fa-exchange-alt"></i> 重分配</button>
                    ` : `
                    <button class="btn btn-outline btn-sm" onclick="openReview(${s.id}, 'return')" style="color:var(--accent-amber);"><i class="fas fa-rotate-left"></i> 重新打回</button>
                    <span style="font-size:11px;color:var(--text-light);">${s.review_remarks||'--'}</span>
                    `}
                </div>
            </td>
        </tr>
    `}).join('');

    // Store submissions data for file viewing
    window._submissions = data.submissions;
}

function changePage(delta) {
    currentPage = Math.max(1, Math.min(totalPages, currentPage + delta));
    loadSubmissions();
}

function openReview(subId, action) {
    currentSub = {id: subId, action};
    const modal = document.getElementById('reviewModal');
    const title = document.getElementById('reviewModalTitle');
    const actions = document.getElementById('reviewActions');
    const reassign = document.getElementById('reassignGroup');

    reassign.style.display = action === 'reassign' ? 'block' : 'none';
    if (action === 'approve') {
        title.textContent = '确认通过审核';
        document.getElementById('reviewModalInfo').textContent = `通过提交 #${subId}，该加分将自动加入学生的综测库。`;
        actions.innerHTML = `<button class="btn btn-outline btn-sm" onclick="closeReview()">取消</button>
            <button class="btn btn-success btn-sm" onclick="submitReview()"><i class="fas fa-check"></i> 确认通过</button>`;
    } else if (action === 'needs_more') {
        title.textContent = '要求补充材料';
        document.getElementById('reviewModalInfo').textContent = `提交 #${subId} 将进入补材料状态，学生补充佐证后再复核。`;
        actions.innerHTML = `<button class="btn btn-outline btn-sm" onclick="closeReview()">取消</button>
            <button class="btn btn-outline btn-sm" style="color:var(--accent-amber);" onclick="submitReview()"><i class="fas fa-triangle-exclamation"></i> 确认补材料</button>`;
    } else if (action === 'reject') {
        title.textContent = '驳回提交';
        document.getElementById('reviewModalInfo').textContent = `驳回提交 #${subId}，学生可重新提交。`;
        actions.innerHTML = `<button class="btn btn-outline btn-sm" onclick="closeReview()">取消</button>
            <button class="btn btn-outline btn-sm" style="color:var(--danger);" onclick="submitReview()"><i class="fas fa-times"></i> 确认驳回</button>`;
    } else if (action === 'return') {
        title.textContent = '重新打回材料';
        document.getElementById('reviewModalInfo').textContent = `重新打回提交 #${subId}，状态将变为需补材料；如果已入账，将撤销该提交对应的综测加分。`;
        actions.innerHTML = `<button class="btn btn-outline btn-sm" onclick="closeReview()">取消</button>
            <button class="btn btn-outline btn-sm" style="color:var(--accent-amber);" onclick="submitReview()"><i class="fas fa-rotate-left"></i> 确认打回</button>`;
    } else {
        title.textContent = '重新分配项目';
        document.getElementById('reviewModalInfo').textContent = `将提交 #${subId} 关联到正确的综测项目。`;
        actions.innerHTML = `<button class="btn btn-outline btn-sm" onclick="closeReview()">取消</button>
            <button class="btn btn-primary btn-sm" onclick="submitReview()"><i class="fas fa-exchange-alt"></i> 确认重分配</button>`;
    }
    document.getElementById('reviewRemarks').value = '';
    document.getElementById('reassignItemId').value = '';
    modal.style.display = 'flex';
}

function closeReview() {
    document.getElementById('reviewModal').style.display = 'none';
    currentSub = null;
}

async function submitReview() {
    const body = {action: currentSub.action, remarks: document.getElementById('reviewRemarks').value.trim()};
    if (currentSub.action === 'reassign') {
        body.catalog_item_id = document.getElementById('reassignItemId').value.trim();
        if (!body.catalog_item_id) { alert('请输入项目ID'); return; }
    }

    try {
        const resp = await fetch(`/api/admin/submissions/${currentSub.id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || '操作失败');

        closeReview();
        showToast('操作成功');
        loadSubmissions();
    } catch (err) {
        alert(err.message);
    }
}

function confidenceLevel(score, row) {
    if ((row && row.status === 'needs_more') || Number(score) < 60) return 'red';
    if (Number(score) >= 90 && !(row && row.missing_fields && row.missing_fields.length)) return 'green';
    return 'amber';
}

function confidenceLabel(level) {
    return level === 'green' ? '绿灯' : level === 'amber' ? '黄灯' : '红灯';
}

function proofTypeName(type) {
    const names = {'appointment':'任职证明/聘书', 'certificate':'荣誉证书/证明', 'award_cert':'获奖证书',
        'paper_publish':'论文发表证明', 'paper_content':'论文全文', 'project_doc':'立项/结项证明',
        'project_result':'项目成果证明', 'patent_cert':'专利/软著证书', 'score_report':'成绩单/证书',
        'cert_file':'等级证书/成绩单', 'transcript':'成绩单', 'admission':'录取证明',
        'article':'发表文章证明', 'participation':'参赛证明', 'general':'相关证明材料'};
    return names[type] || type || '未分类';
}

function openAuditDrawer(subId) {
    const s = (window._submissions || []).find(row => row.id === subId);
    if (!s) return;
    const level = confidenceLevel(s.ai_confidence, s);
    const features = s.extracted_features || {};
    const regulation = s.matched_regulation || {};
    const risk = s.risk_assessment || {};
    document.getElementById('drawerAuditId').textContent = `#${s.id}`;
    document.getElementById('drawerTitle').textContent = s.title || '审核详情';
    document.getElementById('auditDrawerBody').innerHTML = `
        <section class="drawer-section">
            <h4>AI 判定结果</h4>
            <div class="drawer-kv">
                <span>学生</span><strong>${escHtml(s.student_name)}（${escHtml(s.student_id)}）</strong>
                <span>建议项目</span><strong>${escHtml(s.title)}</strong>
                <span>建议分值</span><strong>+${s.score || 0}</strong>
                <span>置信度</span><strong><span class="confidence-tag confidence-${level}">${Number(s.ai_confidence).toFixed(1)}% · ${confidenceLabel(level)}</span></strong>
                <span>状态</span><strong>${STATUS_LABELS[s.status] || escHtml(s.status)}</strong>
            </div>
        </section>
        <section class="drawer-section">
            <h4>结构化识别</h4>
            <div class="drawer-kv">
                <span>姓名</span><strong>${escHtml(features.detected_name || '未识别')}</strong>
                <span>活动/证书</span><strong>${escHtml(features.event_name || s.title || '未识别')}</strong>
                <span>等级</span><strong>${escHtml(features.award_level || s.level || '待确认')}</strong>
                <span>角色</span><strong>${escHtml(features.rank_type || '待确认')}</strong>
                <span>日期</span><strong>${escHtml(features.date || '未识别')}</strong>
                <span>姓名匹配</span><strong>${features.is_name_matched ? '是' : '待核验'}</strong>
            </div>
        </section>
        <section class="drawer-section">
            <h4>细则锚点</h4>
            <p>${escHtml(regulation.clause_text || s.description || '暂无细则文本，需人工核对。')}</p>
        </section>
        <section class="drawer-section">
            <h4>风险预警链</h4>
            <div class="risk-tag-list drawer-tags">${(risk.risk_tags || []).map(tag => `<span>${escHtml(tag)}</span>`).join('') || '<span class="muted">无明显风险标签</span>'}</div>
            <p>${escHtml(risk.risk_description || s.ai_reason || '暂无额外说明。')}</p>
        </section>
        <section class="drawer-section">
            <h4>需补充材料</h4>
            <div class="missing-field-list">
                ${(s.missing_fields || []).map(field => `<div><strong>${escHtml(field.field_name)}</strong><small>${escHtml(field.guidance_tips)}</small></div>`).join('') || '<p class="muted">暂无 AI 生成补件项。</p>'}
            </div>
        </section>
        <section class="drawer-section">
            <h4>核心证据链</h4>
            <ol class="drawer-chain">${(s.audit_chain || []).map(step => `<li>${escHtml(step)}</li>`).join('') || '<li>暂无证据链，按原始材料人工核验。</li>'}</ol>
        </section>
        <section class="drawer-section">
            <h4>原始材料</h4>
            <div class="drawer-file-list">
                ${(s.files || []).map(f => `<a href="/api/uploads/${f.file_path}" target="_blank"><i class="fas fa-paperclip"></i><span>${escHtml(f.filename)}</span><small>${escHtml(proofTypeName(f.proof_type))}</small></a>`).join('') || '<p class="muted">无附件</p>'}
            </div>
        </section>
    `;
    document.getElementById('auditDrawerActions').innerHTML = ['pending', 'needs_more'].includes(s.status) ? `
        <button class="btn btn-outline btn-sm" onclick="openReview(${s.id}, 'reject')"><i class="fas fa-times"></i> 驳回</button>
        <button class="btn btn-outline btn-sm" onclick="openReview(${s.id}, 'needs_more')"><i class="fas fa-triangle-exclamation"></i> 补材料</button>
        <button class="btn btn-success btn-sm" onclick="openReview(${s.id}, 'approve')"><i class="fas fa-check"></i> 通过</button>
    ` : `
        <button class="btn btn-outline btn-sm" onclick="openReview(${s.id}, 'return')"><i class="fas fa-rotate-left"></i> 重新打回</button>
        <span class="text-muted">该记录已处理</span>
    `;
    document.getElementById('auditDrawerOverlay').style.display = 'flex';
}

function closeAuditDrawer(event) {
    if (event && event.target !== document.getElementById('auditDrawerOverlay')) return;
    document.getElementById('auditDrawerOverlay').style.display = 'none';
}

async function bulkApproveHighConfidence() {
    const rows = (window._submissions || []).filter(s =>
        ['pending', 'needs_more'].includes(s.status)
        && Number(s.ai_confidence) >= 90
        && !(s.missing_fields && s.missing_fields.length)
    );
    if (!rows.length) {
        alert('当前页没有可批量通过的绿灯高置信材料');
        return;
    }
    if (!confirm(`确认通过当前页 ${rows.length} 条绿灯高置信材料？通过后将写入学生综测得分。`)) return;
    for (const row of rows) {
        await fetch(`/api/admin/submissions/${row.id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ action: 'approve', remarks: '绿灯高置信材料批量通过。' })
        });
    }
    showToast('批量审核完成');
    loadSubmissions();
    loadStats();
}

function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

// Close modal on overlay click
document.getElementById('reviewModal').addEventListener('click', function(e) {
    if (e.target === this) closeReview();
});

// ===== Files Viewer =====
function showFiles(subId) {
    const subs = window._submissions || [];
    const s = subs.find(x => x.id === subId);
    if (!s || !s.files || s.files.length === 0) { alert('无证明材料'); return; }

    const proofNames = {'appointment':'任职证明/聘书', 'certificate':'荣誉证书/证明', 'award_cert':'获奖证书',
        'paper_publish':'论文发表证明', 'paper_content':'论文全文', 'project_doc':'立项/结项证明',
        'project_result':'项目成果证明', 'patent_cert':'专利/软著证书', 'score_report':'成绩单/证书',
        'cert_file':'等级证书/成绩单', 'transcript':'成绩单', 'admission':'录取证明',
        'article':'发表文章证明', 'participation':'参赛证明', 'general':'相关证明材料'};

    let html = `<h3>证明材料 - 提交 #${subId}</h3>
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">
            学生: ${escHtml(s.student_name)} | 项目: ${escHtml(s.title)} | AI置信度: ${Number(s.ai_confidence).toFixed(1)}%
            ${s.proofs_complete ? ' | <span style="color:var(--success);">材料完整</span>' : (s.missing_proofs && s.missing_proofs.length > 0 ? ` | <span style="color:var(--danger);">缺失: ${s.missing_proofs.join(', ')}</span>` : '')}
        </p>`;

    html += s.files.map(f => `
        <div style="display:flex;align-items:center;gap:10px;padding:10px;margin:6px 0;background:var(--surface-alt);border-radius:8px;">
            <i class="fas ${f.file_type==='pdf'?'fa-file-pdf':(f.file_type.includes('doc')?'fa-file-word':'fa-file-image')}" style="font-size:18px;color:var(--primary);"></i>
            <div style="flex:1;min-width:0;">
                <strong style="font-size:13px;">${escHtml(f.filename)}</strong>
                <span style="font-size:11px;color:var(--text-muted);display:block;">${proofNames[f.proof_type] || f.proof_type || '未分类'} | ${f.uploaded_at}</span>
            </div>
            <a href="/api/uploads/${f.file_path}" target="_blank" class="btn btn-outline btn-sm"><i class="fas fa-eye"></i> 查看</a>
        </div>
    `).join('');

    const modal = document.getElementById('reviewModal');
    document.getElementById('reviewModalTitle').textContent = '证明材料详情';
    document.getElementById('reviewModalInfo').innerHTML = html;
    document.getElementById('reviewActions').innerHTML = `<button class="btn btn-outline btn-sm" onclick="closeReview()">关闭</button>`;
    document.getElementById('reassignGroup').style.display = 'none';
    modal.style.display = 'flex';
}

loadSubmissions();
loadStats();

async function loadStats() {
    try {
        const resp = await fetch('/api/admin/stats');
        const data = await resp.json();
        document.getElementById('statStudents').textContent = data.total_students;
        document.getElementById('statPending').textContent = data.pending_reviews;
        document.getElementById('statApproved').textContent = data.approved_today;
        document.getElementById('statSubmissions').textContent = data.total_submissions;
    } catch (err) {
        console.error('Failed to load stats:', err);
    }
}
</script>
{% endblock %}
