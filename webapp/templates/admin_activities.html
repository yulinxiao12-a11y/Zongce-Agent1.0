{% extends "base.html" %}
{% block title %}活动管理 - 综测星轨{% endblock %}
{% block content %}
<div class="page">
    <div class="page-header flex-between" style="padding:24px 0 8px;margin-bottom:20px;">
        <div><h1 style="font-size:28px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px;"><i class="fas fa-calendar-alt" style="color:var(--primary);"></i> 近期活动管理</h1><p style="color:var(--text-muted);margin-top:4px;font-size:14px;">发布和管理近期活动 · 学生可在机会大厅查看</p></div>
        <button class="btn btn-primary" onclick="openAddActivity()"><i class="fas fa-plus"></i> 发布活动</button>
    </div>

    <div class="card"><div class="card-body" style="padding:0;"><div class="table-wrap"><table class="admin-table">
        <thead><tr><th>ID</th><th>标题</th><th>级别</th><th>分类</th><th>日期</th><th>状态</th><th>关联加分</th><th>操作</th></tr></thead>
        <tbody id="activitiesBody"><tr><td colspan="8"><div class="spinner"></div></td></tr></tbody>
    </table></div></div></div>
</div>

<div class="modal-overlay" id="actModal" style="display:none;">
    <div class="modal-box" style="max-width:600px;" id="actModalContent"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
const STATUS_LABELS = {'报名中':'badge-academic','进行中':'status-auto_approved','即将开始':'status-pending','已结束':'status-rejected'};

async function loadActivities() {
    const resp = await fetch('/api/admin/activities');
    const data = await resp.json();
    const acts = data.activities;
    if (!acts.length) {
        document.getElementById('activitiesBody').innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted);">暂无活动</td></tr>';
        return;
    }
    document.getElementById('activitiesBody').innerHTML = acts.map(a => `
        <tr>
            <td><code>${escHtml(a.id)}</code></td>
            <td><strong>${escHtml(a.title)}</strong></td>
            <td><span class="badge badge-college">${escHtml(a.level)}</span></td>
            <td>${escHtml(a.category)}</td>
            <td>${escHtml(a.date)}</td>
            <td><span class="badge ${STATUS_LABELS[a.status]||'badge-college'}">${escHtml(a.status)}</span></td>
            <td style="font-size:12px;">${escHtml(a.related_score)}</td>
            <td><div class="action-btns">
                <button class="btn btn-outline btn-sm" onclick="editActivity('${a.id}')"><i class="fas fa-edit"></i></button>
                <button class="btn btn-outline btn-sm" onclick="deleteActivity('${a.id}')" style="color:var(--danger);"><i class="fas fa-trash"></i></button>
            </div></td>
        </tr>`).join('');
}

function openAddActivity() {
    document.getElementById('actModalContent').innerHTML = `
        <h3>发布新活动</h3>
        <div style="background:var(--primary-light);border-radius:8px;padding:12px;margin-bottom:14px;">
            <p style="font-size:12px;color:var(--text-muted);margin:0 0 8px;">上传通知截图/PDF/Word，AI 自动扫描并填充表单</p>
            <div style="margin-bottom:8px;">
                <div id="publishDropZone" style="border:2px dashed var(--border);border-radius:8px;padding:14px;text-align:center;cursor:pointer;background:#fff;transition:border-color .2s;"
                    onclick="this.querySelector('input').click()"
                    ondragover="event.preventDefault();this.style.borderColor='var(--primary)'"
                    ondragleave="this.style.borderColor='var(--border)'"
                    ondrop="handlePublishDrop(event)">
                    <input type="file" multiple accept=".jpg,.jpeg,.png,.bmp,.webp,.pdf,.doc,.docx" style="display:none;" onchange="handlePublishFiles(this.files)">
                    <strong style="font-size:13px;color:#475569;">📎 点击或拖拽文件到此处</strong><br>
                    <span style="font-size:11px;color:#94a3b8;">支持 JPG、PNG、PDF、DOCX 格式</span>
                </div>
                <div id="publishFileList" style="margin-top:6px;display:none;flex-direction:column;gap:4px;"></div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <button class="btn btn-sm" style="background:var(--primary);color:#fff;border:0;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;" onclick="aiScanFiles()">🤖 AI 扫描文件并填充</button>
                <span id="scanStatus" style="font-size:11px;color:var(--text-muted);"></span>
            </div>
        </div>
        <div class="form-group"><label>活动标题</label><input type="text" id="actTitle" required></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div class="form-group"><label>级别</label><select id="actLevel"><option>院级</option><option>校级</option><option>省级</option><option>国家级</option></select></div>
            <div class="form-group"><label>分类</label><select id="actCat"><option>院级活动</option><option>社会实践</option><option>志愿服务</option><option>文体活动</option><option>学术讲座</option><option>其他</option></select></div>
            <div class="form-group"><label>日期</label><input type="date" id="actDate"></div>
            <div class="form-group"><label>状态</label><select id="actStatus"><option>即将开始</option><option>报名中</option><option>进行中</option><option>已结束</option></select></div>
        </div>
        <div class="form-group"><label>主办单位</label><input type="text" id="actOrganizer"></div>
        <div class="form-group"><label>活动描述</label><textarea id="actDesc" style="width:100%;min-height:60px;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;"></textarea></div>
        <div class="form-group"><label>关联综测加分</label><input type="text" id="actScore" placeholder="如：品德+1-3分"></div>
        <div class="modal-actions"><button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button><button class="btn btn-primary btn-sm" onclick="saveActivity()"><i class="fas fa-save"></i> 发布</button></div>`;
    document.getElementById('actModal').style.display = 'flex';
    window._publishFiles = [];
    window._publishFileIds = [];
}

function editActivity(actId) {
    fetch('/api/admin/activities').then(r=>r.json()).then(data => {
        const a = data.activities.find(x => x.id === actId);
        if (!a) return;
        document.getElementById('actModalContent').innerHTML = `
            <h3>编辑活动</h3>
            <div class="form-group"><label>活动标题</label><input type="text" id="actTitle" value="${escHtml(a.title)}" required></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="form-group"><label>级别</label><select id="actLevel">${['院级','校级','省级','国家级'].map(l=>`<option ${a.level===l?'selected':''}>${l}</option>`).join('')}</select></div>
                <div class="form-group"><label>分类</label><select id="actCat">${['院级活动','社会实践','志愿服务','文体活动','学术讲座','其他'].map(c=>`<option ${a.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
                <div class="form-group"><label>日期</label><input type="date" id="actDate" value="${a.date}"></div>
                <div class="form-group"><label>状态</label><select id="actStatus">${['即将开始','报名中','进行中','已结束'].map(s=>`<option ${a.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
            </div>
            <div class="form-group"><label>主办单位</label><input type="text" id="actOrganizer" value="${escHtml(a.organizer||'')}"></div>
            <div class="form-group"><label>活动描述</label><textarea id="actDesc" style="width:100%;min-height:60px;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;">${escHtml(a.description||'')}</textarea></div>
            <div class="form-group"><label>关联综测加分</label><input type="text" id="actScore" value="${escHtml(a.related_score||'')}"></div>
            <div class="modal-actions"><button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button><button class="btn btn-primary btn-sm" onclick="updateActivity('${actId}')"><i class="fas fa-save"></i> 保存</button></div>`;
        document.getElementById('actModal').style.display = 'flex';
    });
}

function handlePublishFiles(files) {
    files = Array.from(files).filter(f => {
        const ext = f.name.split('.').pop().toLowerCase();
        return ['jpg','jpeg','png','bmp','webp','gif','pdf','doc','docx'].includes(ext);
    });
    if (!files.length) return;
    const existing = window._publishFiles || [];
    const added = files.filter(f => !existing.some(e => e.name===f.name && e.size===f.size));
    window._publishFiles = [...existing, ...added];
    renderPublishFiles();
}

function handlePublishDrop(e) {
    e.preventDefault();
    e.target.style.borderColor = 'var(--border)';
    if (e.dataTransfer && e.dataTransfer.files) handlePublishFiles(e.dataTransfer.files);
}

function removePublishFile(idx) {
    window._publishFiles.splice(idx, 1);
    renderPublishFiles();
}

function renderPublishFiles() {
    const el = document.getElementById('publishFileList');
    const files = window._publishFiles || [];
    if (!el) return;
    if (!files.length) { el.style.display = 'none'; return; }
    el.style.display = 'flex';
    el.innerHTML = files.map((f, i) => {
        const ext = f.name.split('.').pop().toUpperCase();
        const kb = (f.size/1024).toFixed(1);
        return '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f1f5f9;border-radius:6px;font-size:12px;">'
            + '<b style="font-size:10px;background:var(--primary);color:#fff;padding:2px 5px;border-radius:3px;">'+ext+'</b>'
            + '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escHtml(f.name)+'</span>'
            + '<small style="color:var(--text-muted);">'+kb+' KB</small>'
            + '<button onclick="removePublishFile('+i+')" style="border:0;background:none;color:var(--danger);cursor:pointer;font-size:14px;padding:0 4px;">x</button>'
            + '</div>';
    }).join('');
}

async function aiScanFiles() {
    const files = window._publishFiles || [];
    if (!files.length) { showToast('请先选择需要扫描的文件'); return; }
    const status = document.getElementById('scanStatus');
    status.textContent = '⏳ 上传中...';
    try {
        const form = new FormData();
        files.forEach(f => form.append('files', f));
        const upResp = await fetch('/api/upload', { method: 'POST', body: form });
        const upData = await upResp.json();
        const fileIds = (upData.files || []).map(f => f.id).filter(Boolean);
        if (!fileIds.length) { status.textContent = '上传失败'; return; }
        window._publishFileIds = fileIds;

        status.textContent = '🔍 AI正在扫描识别文字...';
        const analyzeResp = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uploaded_file_ids: fileIds, keyword: '' })
        });
        const analyzeData = await analyzeResp.json();
        const results = analyzeData.results || [];
        const allText = results.map(r => r.extracted_text_full || r.extracted_text || '').filter(Boolean).join('\n\n');

        if (!allText.trim()) { status.textContent = '未能提取到文字，请尝试直接输入'; return; }

        // Fill form from extracted text
        const lines = allText.split(/[\n\r]+/).filter(l => l.trim());
        const titleGuess = lines.find(l => l.length > 6 && l.length < 100) || files[0].name.replace(/\.[^.]+$/, '');
        if (titleGuess) document.getElementById('actTitle').value = titleGuess.slice(0, 200);
        document.getElementById('actDesc').value = allText.slice(0, 2000);

        // Try AI suggestion from extracted text
        try {
            const aiResp = await fetch('/api/admin/activities/ai-fill', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: titleGuess.slice(0, 60), description: allText.slice(0, 2000) })
            });
            const aiData = await aiResp.json();
            if (aiData.category) document.getElementById('actCat').value = aiData.category==='academic'?'学术讲座':aiData.category==='moral'?'社会实践':'文体活动';
            if (aiData.level) document.getElementById('actLevel').value = aiData.level;
            if (aiData.section) document.getElementById('actOrganizer').value = aiData.section;
            if (aiData.suggested_score) document.getElementById('actScore').value = '学业+'+aiData.suggested_score+'分';
        } catch {}

        // Date detection
        const dm = allText.match(/(20\d{2}[年\-\/\.]\d{1,2}[月\-\/\.]\d{1,2}[日号])/);
        if (dm) document.getElementById('actDate').value = dm[1].replace(/[年月]/g,'-').replace(/[日号]/g,'');

        status.textContent = '✅ 已扫描 '+results.length+' 个文件并填充，请核对';
        window._publishFiles = [];
        renderPublishFiles();
    } catch(e) { status.textContent = '扫描失败：'+e.message; }
}

async function saveActivity() {
    const payload = { title:$('actTitle').value, level:$('actLevel').value, category:$('actCat').value, date:$('actDate').value, status:$('actStatus').value, organizer:$('actOrganizer').value, description:$('actDesc').value, related_score:$('actScore').value };
    await fetch('/api/admin/activities', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    closeModal(); loadActivities(); showToast('活动已发布');
}

async function updateActivity(id) {
    const payload = { title:$('actTitle').value, level:$('actLevel').value, category:$('actCat').value, date:$('actDate').value, status:$('actStatus').value, organizer:$('actOrganizer').value, description:$('actDesc').value, related_score:$('actScore').value };
    await fetch('/api/admin/activities/' + id, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    closeModal(); loadActivities(); showToast('活动已更新');
}

async function deleteActivity(id) { if(!confirm('确定删除此活动吗？'))return; await fetch('/api/admin/activities/'+id,{method:'DELETE'}); loadActivities(); showToast('已删除'); }
function closeModal() { document.getElementById('actModal').style.display = 'none'; }
function $(id) { return document.getElementById(id); }
function escHtml(s) { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function showToast(msg) { const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }

document.getElementById('actModal').addEventListener('click', function(e) { if(e.target===this) closeModal(); });
loadActivities();
</script>
{% endblock %}
